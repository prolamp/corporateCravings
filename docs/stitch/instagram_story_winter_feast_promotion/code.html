<script>
        // Micro-interaction: Progress bar animation reset simulation
        document.addEventListener('DOMContentLoaded', () => {
            const bar = document.getElementById('progress-bar');
            bar.style.transform = 'scaleX(0)';
            setTimeout(() => {
                bar.style.transform = 'scaleX(1)';
            }, 100);
        });

        // Simple parallax effect on mouse move for the container
        const container = document.querySelector('.aspect-\\[9\\/16\\]');
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const deltaX = (x - centerX) / 20;
            const deltaY = (y - centerY) / 20;
            
            container.style.transform = `perspective(1000px) rotateY(${deltaX}deg) rotateX(${-deltaY}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            container.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
        });
    </script>
