<style>

        }

        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {

            border-radius: 10px;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden custom-scrollbar">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="flex justify-between items-center px-6 h-[72px] w-full fixed top-0 z-50 glass-header">
<button class="p-2 hover:bg-surface-container-highest transition-colors rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary font-bold">Checkout</h1>
<button class="p-2 hover:bg-surface-container-highest transition-colors rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">notifications</span>
</button>
</header>
<main class="pt-[88px] pb-32 px-4 max-w-md mx-auto space-y-8">
<!-- Section: Delivery Address -->
<section class="space-y-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">location_on</span>
<h2 class="font-headline-sm text-headline-sm-mobile text-primary">Delivery Address</h2>
</div>
<div class="bg-surface-container p-6 rounded-xl border border-outline-variant/30 shadow-sm space-y-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">Full Name</label>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:border-primary-container transition-all" placeholder="Johnathan Sterling" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">Street Address</label>
<textarea class="w-full bg-surface-container-high border border-outline-variant rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:border-primary-container transition-all resize-none" placeholder="Suite 402, Golden Plaza, Financial District" rows="2"></textarea>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">Phone Number</label>
<div class="flex gap-2">
<div class="w-20 bg-surface-container-high border border-outline-variant rounded-lg px-2 py-3 text-center text-on-surface-variant">+1</div>
<input class="flex-1 bg-surface-container-high border border-outline-variant rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:border-primary-container transition-all" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
</div>
</section>
<!-- Section: Delivery Time Slot -->
<section class="space-y-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">schedule</span>
<h2 class="font-headline-sm text-headline-sm-mobile text-primary">Delivery Time</h2>
</div>
<div class="flex gap-3 overflow-x-auto pb-2 custom-scrollbar">
<!-- Slot 1 -->
<label class="flex-shrink-0 cursor-pointer group">
<input checked="" class="hidden peer" name="timeslot" type="radio"/>
<div class="px-6 py-4 rounded-xl bg-surface-container border border-outline-variant peer-checked:border-primary-container peer-checked:bg-primary-container/10 transition-all group-hover:bg-surface-container-highest">
<p class="font-label-md text-label-md text-primary-container mb-1">ASAP</p>
<p class="font-headline-sm text-[16px] text-on-surface">30-45 mins</p>
</div>
</label>
<!-- Slot 2 -->
<label class="flex-shrink-0 cursor-pointer group">
<input class="hidden peer" name="timeslot" type="radio"/>
<div class="px-6 py-4 rounded-xl bg-surface-container border border-outline-variant peer-checked:border-primary-container peer-checked:bg-primary-container/10 transition-all group-hover:bg-surface-container-highest">
<p class="font-label-md text-label-md text-on-surface-variant mb-1">Lunch</p>
<p class="font-headline-sm text-[16px] text-on-surface">12:30 PM</p>
</div>
</label>
<!-- Slot 3 -->
<label class="flex-shrink-0 cursor-pointer group">
<input class="hidden peer" name="timeslot" type="radio"/>
<div class="px-6 py-4 rounded-xl bg-surface-container border border-outline-variant peer-checked:border-primary-container peer-checked:bg-primary-container/10 transition-all group-hover:bg-surface-container-highest">
<p class="font-label-md text-label-md text-on-surface-variant mb-1">Afternoon</p>
<p class="font-headline-sm text-[16px] text-on-surface">02:15 PM</p>
</div>
</label>
</div>
</section>
<!-- Section: Payment Method -->
<section class="space-y-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">payments</span>
<h2 class="font-headline-sm text-headline-sm-mobile text-primary">Payment Method</h2>
</div>
<div class="space-y-3">
<!-- COD -->
<label class="flex items-center justify-between p-4 rounded-xl bg-surface-container border border-outline-variant cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">delivery_dining</span>
<span class="font-body-md text-on-surface">Cash on Delivery</span>
</div>
<input class="w-5 h-5 text-primary-container bg-surface-container-high border-outline-variant focus:ring-0 focus:ring-offset-0" name="payment" type="radio"/>
</label>
<!-- Credit Card -->
<label class="flex items-center justify-between p-4 rounded-xl bg-surface-container border border-primary-container bg-primary-container/5 cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary-container">credit_card</span>
<span class="font-body-md text-on-surface">Credit / Debit Card</span>
</div>
<input checked="" class="w-5 h-5 text-primary-container bg-surface-container-high border-outline-variant focus:ring-0 focus:ring-offset-0" name="payment" type="radio"/>
</label>
<!-- Bank Transfer -->
<label class="flex items-center justify-between p-4 rounded-xl bg-surface-container border border-outline-variant cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">account_balance</span>
<span class="font-body-md text-on-surface">Bank Transfer</span>
</div>
<input class="w-5 h-5 text-primary-container bg-surface-container-high border-outline-variant focus:ring-0 focus:ring-offset-0" name="payment" type="radio"/>
</label>
</div>
</section>
<!-- Order Summary Section -->
<section class="space-y-4">
<h2 class="font-headline-sm text-headline-sm-mobile text-primary">Order Summary</h2>
<div class="bg-surface-container p-6 rounded-xl border border-outline-variant/30 space-y-4">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant">Subtotal (3 items)</span>
<span class="text-on-surface font-semibold">$124.50</span>
</div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant">Delivery Fee</span>
<span class="text-on-surface font-semibold text-primary-container">Free</span>
</div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant">Taxes (8%)</span>
<span class="text-on-surface font-semibold">$9.96</span>
</div>
<div class="pt-4 border-t border-outline-variant/30 flex justify-between items-center">
<span class="font-headline-sm text-[18px] text-on-surface">Total Amount</span>
<span class="font-headline-sm text-headline-sm-mobile text-primary-container">$134.46</span>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar (Fixed) -->
<footer class="fixed bottom-0 w-full z-50 glass-header px-6 py-5 border-t border-outline-variant/20 rounded-t-3xl shadow-2xl">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-xl shadow-[0_8px_24px_-4px_rgba(246,198,12,0.3)] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
<span>COMPLETE PURCHASE</span>
<span class="material-symbols-outlined text-[18px]">lock</span>
</button>
<p class="text-center text-[10px] text-on-surface-variant/60 mt-3 uppercase tracking-widest">Secure encrypted transaction</p>
</div>
</footer>
<!-- Interaction Script -->
<script>
        // Simple micro-interactions for input focus effects
        const inputs = document.querySelectorAll('input[type="text"], input[type="tel"], textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary-container');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary-container');
            });
        });

        // Payment radio group visual handling
        const paymentLabels = document.querySelectorAll('input[name="payment"]');
        paymentLabels.forEach(radio => {
            radio.addEventListener('change', () => {
                document.querySelectorAll('input[name="payment"]').forEach(r => {
                    const parent = r.closest('label');
                    if(r.checked) {
                        parent.classList.add('border-primary-container', 'bg-primary-container/5');
                        parent.classList.remove('border-outline-variant');
                        parent.querySelector('.material-symbols-outlined').classList.add('text-primary-container');
                        parent.querySelector('.material-symbols-outlined').classList.remove('text-on-surface-variant');
                    } else {
                        parent.classList.remove('border-primary-container', 'bg-primary-container/5');
                        parent.classList.add('border-outline-variant');
                        parent.querySelector('.material-symbols-outlined').classList.remove('text-primary-container');
                        parent.querySelector('.material-symbols-outlined').classList.add('text-on-surface-variant');
                    }
                });
            });
        });
    </script>
</body></html>
